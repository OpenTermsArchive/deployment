---
- name: Ensure PM2_HOME directory exists
  ansible.builtin.file:
    path: "{{ ota_pm2_home }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true
  tags:
    - start
    - restart

- name: Copy pm2.config.cjs file
  ansible.builtin.copy:
    src: "{{ inventory_dir }}/pm2.config.cjs"
    dest: /home/{{ ansible_user }}/{{ ota_pm2_app_directory }}/pm2.config.cjs
    force: true
    mode: "0644"
  tags:
    - restart
    - start

- name: Check for legacy PM2 startup unit # Shared by all applications of the user and pointing to the default PM2 home, generated by versions up to 5.0.1
  ansible.builtin.stat:
    path: /etc/systemd/system/pm2-{{ ansible_user }}.service
  register: ota_pm2_legacy_unit
  tags:
    - restart
    - start

- name: Remove legacy PM2 startup unit
  ansible.builtin.shell: sudo env PATH=$PATH:/usr/bin pm2 unstartup systemd --user {{ ansible_user }}
  when: ota_pm2_legacy_unit.stat.exists
  tags:
    - restart
    - start

- name: Generate and enable PM2 startup unit # Without `--hp`, as PM2 would then derive the home from it and ignore `PM2_HOME`
  ansible.builtin.shell: >-
    sudo env PATH=$PATH:/usr/bin PM2_HOME="{{ ota_pm2_home }}"
    pm2 startup systemd --user {{ ansible_user }} --service-name pm2-{{ ota_pm2_app_id }}
  tags:
    - restart
    - start

- name: Read generated PM2 startup unit
  ansible.builtin.slurp:
    src: /etc/systemd/system/pm2-{{ ota_pm2_app_id }}.service
  register: ota_pm2_unit
  tags:
    - restart
    - start

- name: Ensure PM2 startup unit uses the application PM2 home
  ansible.builtin.assert:
    that: "'Environment=PM2_HOME=' ~ ota_pm2_home in (ota_pm2_unit.content | b64decode)"
    fail_msg: "The PM2 startup unit does not use {{ ota_pm2_home }}; applications would not be restarted after a reboot"
    quiet: true
  tags:
    - restart
    - start

- name: Fix PM2_HOME ownership after startup script generation
  ansible.builtin.file:
    path: "{{ ota_pm2_home }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
    recurse: true
  become: true
  tags:
    - restart
    - start

- name: Start Open Terms Archive applications
  ansible.builtin.command:
    cmd: pm2 startOrRestart pm2.config.cjs
    chdir: /home/{{ ansible_user }}/{{ ota_pm2_app_directory }}
  environment:
    NODE_ENV: production
    PM2_HOME: "{{ ota_pm2_home }}"
  tags:
    - restart
    - start

- name: Save PM2 process list for auto-restart
  ansible.builtin.command:
    cmd: pm2 save
    chdir: /home/{{ ansible_user }}/{{ ota_pm2_app_directory }}
  environment:
    PM2_HOME: "{{ ota_pm2_home }}"
  tags:
    - restart
    - start
