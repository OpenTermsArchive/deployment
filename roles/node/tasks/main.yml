---
# Install Node.js from the NodeSource APT repository on every supported
# distribution. NodeSource provides the major version required by the engine,
# independently of what each distribution ships natively.
#
# NodeSource re-signed its repository with a SHA-512 key in early 2026, so the
# repository works again on Debian 13, whose apt rejects the previous SHA-1 key.
# See https://github.com/nodesource/distributions/issues/1908

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "755"

- name: Download and import the NodeSource GPG key
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --yes --dearmor -o /etc/apt/keyrings/nodesource.gpg
  args:
    executable: /bin/bash

- name: Add NodeSource APT repository
  ansible.builtin.shell: set -o pipefail && echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_26.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list # Remember to update the major version of NPM when updating the major version of Node
  args:
    executable: /bin/bash

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    update_cache: true
    state: latest # The major version of NodeJS is provided by the NodeSource repository defined in the task above

- name: Install NPM 11
  ansible.builtin.command: npm install -g npm@11
