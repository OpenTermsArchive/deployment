name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-decision:
    uses: OpenTermsArchive/shared-workflows/.github/workflows/release-decision.yml@56599daff47c9d22e417c076825c390de67be18e # v0.3.0

  changelog:
    needs: release-decision
    if: ${{ needs.release-decision.outputs.should-release == 'true' }}
    uses: OpenTermsArchive/shared-workflows/.github/workflows/changelog.yml@56599daff47c9d22e417c076825c390de67be18e # v0.3.0

  release:
    needs: changelog
    if: ${{ needs.changelog.outputs.release-type != 'no-release' }}
    uses: OpenTermsArchive/shared-workflows/.github/workflows/release.yml@56599daff47c9d22e417c076825c390de67be18e # v0.3.0
    with:
      npm: none
      galaxy: publish
    secrets: inherit

  clean-changelog:
    needs: changelog
    if: ${{ needs.changelog.outputs.release-type == 'no-release' }}
    uses: OpenTermsArchive/shared-workflows/.github/workflows/clean-changelog.yml@56599daff47c9d22e417c076825c390de67be18e # v0.3.0
    secrets: inherit
